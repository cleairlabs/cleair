<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cleair Live Flow Playground</title>
  <style>
    :root {
      --bg: #f2f5f1;
      --surface: #ffffff;
      --line: #d8dfd7;
      --text: #1b221d;
      --muted: #667168;
      --ok: #2f6e5d;
      --warn: #99661f;
      --error: #b42318;
      --run: #266ca7;
      --shadow: 0 10px 30px rgba(16, 24, 19, 0.08);
      --radius: 12px;
      --font-ui: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      --font-mono: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: radial-gradient(circle at 0% 0%, #ffffff 0%, var(--bg) 55%) fixed;
      color: var(--text);
      font-family: var(--font-ui);
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(242, 245, 241, 0.9);
      backdrop-filter: blur(8px);
      padding: 14px 18px;
    }

    .topbar-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .select,
    .btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
    }

    .btn {
      cursor: pointer;
    }

    .btn.primary {
      border-color: #bfd6cc;
      background: #eaf2ee;
      color: var(--ok);
      font-weight: 600;
    }

    .btn:hover,
    .select:hover {
      border-color: #c4d0c7;
    }

    .page {
      max-width: 1320px;
      width: 100%;
      margin: 0 auto;
      padding: 18px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 440px;
      gap: 14px;
      align-content: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .panel-title {
      margin: 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
      padding: 4px 8px;
      background: #f9fbf8;
    }

    .flow-wrap {
      position: relative;
      min-height: 760px;
      overflow: auto;
      background:
        linear-gradient(#ffffff, #ffffff) padding-box,
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 39px,
          rgba(216, 223, 215, 0.35) 40px
        ),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 39px,
          rgba(216, 223, 215, 0.28) 40px
        );
    }

    .flow {
      position: relative;
      width: 760px;
      height: 960px;
    }

    .edge {
      position: absolute;
      height: 2px;
      background: #cad6cd;
      transform-origin: left center;
      border-radius: 2px;
      opacity: 0.9;
    }

    .edge.active {
      background: linear-gradient(90deg, #95b7a9, #5f957f);
    }

    .pulse {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--run);
      box-shadow: 0 0 0 6px rgba(38, 108, 167, 0.14);
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .node {
      position: absolute;
      width: 210px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f9fbf8;
      padding: 12px;
      box-shadow: 0 4px 14px rgba(16, 24, 19, 0.06);
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      user-select: none;
    }

    .node:hover {
      transform: translateY(-1px);
      border-color: #c3d1c7;
    }

    .node-title {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
    }

    .node-sub {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      display: inline-block;
      margin-right: 6px;
      vertical-align: middle;
      background: #b9c6bd;
    }

    .state-idle .dot { background: #b9c6bd; }
    .state-running {
      border-color: #9cc0b1;
      background: #f1f8f4;
      box-shadow: 0 0 0 4px rgba(47, 110, 93, 0.1), 0 5px 14px rgba(16, 24, 19, 0.07);
    }
    .state-running .dot { background: var(--run); }
    .state-done {
      border-color: #b9d5ca;
      background: #eef7f2;
    }
    .state-done .dot { background: var(--ok); }
    .state-warn {
      border-color: #e3cfb5;
      background: #faf3ea;
    }
    .state-warn .dot { background: var(--warn); }
    .state-error {
      border-color: #ebc4c0;
      background: #fbeeed;
    }
    .state-error .dot { background: var(--error); }

    .details {
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .box {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f9fbf8;
      padding: 10px;
      min-height: 0;
    }

    .box h3 {
      margin: 0 0 6px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      font-weight: 600;
    }

    .big {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .copy {
      margin: 0;
      font-size: 14px;
      line-height: 1.45;
      color: #2e3832;
    }

    .mono {
      font-family: var(--font-mono);
      font-size: 12px;
      color: #2f3c34;
      word-break: break-all;
    }

    .detail-panel .chip {
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 840px) {
      .page {
        grid-template-columns: 1fr;
      }

      .details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="title">Cleair Live Agent Flow</h1>
      <div class="controls">
        <select id="runSelect" class="select"></select>
        <button id="startBtn" class="btn primary">Start</button>
        <button id="pauseBtn" class="btn">Pause</button>
        <button id="resetBtn" class="btn">Reset</button>
        <select id="speedSelect" class="select">
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="panel flow-panel">
      <div class="panel-head">
        <p class="panel-title">Flow</p>
        <div class="chips" id="topChips"></div>
      </div>
      <div class="flow-wrap">
        <div class="flow" id="flowCanvas"></div>
      </div>
    </section>

    <section class="panel detail-panel">
      <div class="panel-head">
        <p class="panel-title">Why This Step</p>
        <div class="chip" id="selectedState">No step selected</div>
      </div>
      <div class="details">
        <div class="box">
          <h3>What</h3>
          <p class="copy" id="whatText">Click any box in the flow.</p>
        </div>
        <div class="box">
          <h3>Why</h3>
          <p class="copy" id="whyText">You will see a simple explanation here.</p>
        </div>
        <div class="box">
          <h3>Overall</h3>
          <p class="big" id="overallText">Ready</p>
          <p class="copy" id="overallNote">Press Start to watch the run.</p>
        </div>
        <div class="box">
          <h3>Trace</h3>
          <p class="mono" id="traceText">-</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    const runs = [
      {
        id: "12d0a93f39a64918a0aa06124ce7ef19",
        name: "Greeting + Recovery",
        totalMs: 4273,
        result: "Recovered after one failed step",
        nodes: [
          {id: "n1", label: "Start", sub: "User asks for help", x: 170, y: 60, what: "The run begins.", why: "Every run needs a clear starting point.", final: "done"},
          {id: "n2", label: "Read Request", sub: "Understand intent", x: 170, y: 185, what: "The agent reads the user input.", why: "It needs intent before acting.", final: "done"},
          {id: "n3", label: "Model Reply 1", sub: "First response", x: 170, y: 310, what: "The model generates a reply.", why: "This is the core answer step.", final: "done"},
          {id: "n4", label: "Model Reply 2", sub: "Second response", x: 170, y: 435, what: "A second normal reply is generated.", why: "This tests repeat reliability.", final: "done"},
          {id: "n5", label: "Synthetic Failure", sub: "Intentional boom", x: 170, y: 560, what: "A forced error is triggered.", why: "It tests safe failure behavior.", final: "error"},
          {id: "n6", label: "Recover", sub: "Catch and continue", x: 170, y: 685, what: "The error is caught and handled.", why: "Users should still get a stable experience.", final: "done"},
          {id: "n7", label: "Finish", sub: "Run ends cleanly", x: 170, y: 810, what: "The run completes.", why: "Recovery allowed the workflow to finish.", final: "done"}
        ],
        edges: [
          {from: "n1", to: "n2"},
          {from: "n2", to: "n3"},
          {from: "n3", to: "n4"},
          {from: "n4", to: "n5"},
          {from: "n5", to: "n6"},
          {from: "n6", to: "n7"}
        ]
      },
      {
        id: "57d908318a5944ab975a1a6dbf46f78e",
        name: "Summary + Warning",
        totalMs: 1840,
        result: "Completed with one warning",
        nodes: [
          {id: "m1", label: "Start", sub: "User asks for summary", x: 170, y: 120, what: "The run begins.", why: "The agent receives a summarization request.", final: "done"},
          {id: "m2", label: "Collect Context", sub: "Gather useful facts", x: 170, y: 285, what: "The agent fetches background context.", why: "Good context improves summary quality.", final: "done"},
          {id: "m3", label: "Generate Summary", sub: "Main model step", x: 170, y: 450, what: "The model writes the summary.", why: "This is where most time is spent.", final: "warn"},
          {id: "m4", label: "Return Result", sub: "Deliver answer", x: 170, y: 615, what: "The final answer is returned.", why: "Even with a warning, output is delivered.", final: "done"}
        ],
        edges: [
          {from: "m1", to: "m2"},
          {from: "m2", to: "m3"},
          {from: "m3", to: "m4"}
        ]
      },
      {
        id: "a8813c88a3dc4d128f7a65e58f3f0b88",
        name: "Agent + RAG Side Branch",
        totalMs: 2960,
        result: "Completed with retrieved context from tools",
        nodes: [
          {
            id: "a1",
            label: "Start",
            sub: "User asks a knowledge question",
            x: 170,
            y: 60,
            what: "The run starts with a user question.",
            why: "The agent begins by framing the task.",
            final: "done"
          },
          {
            id: "a2",
            label: "Understand Request",
            sub: "Agent parses intent",
            x: 170,
            y: 190,
            what: "The agent identifies what information is needed.",
            why: "Intent detection decides whether retrieval is required.",
            final: "done"
          },
          {
            id: "a3",
            label: "Plan Answer",
            sub: "Agent decides to use RAG",
            x: 170,
            y: 320,
            what: "The agent chooses a retrieval path before answering.",
            why: "Using evidence reduces hallucinations.",
            final: "done"
          },
          {
            id: "a4",
            label: "RAG Retrieve",
            sub: "Move to info retrieval lane",
            x: 430,
            y: 320,
            what: "The flow enters the retrieval branch.",
            why: "The answer needs external factual grounding.",
            final: "done"
          },
          {
            id: "a5",
            label: "Tool: Vector Search",
            sub: "Find candidate documents",
            x: 430,
            y: 450,
            what: "The tool fetches relevant chunks from the knowledge base.",
            why: "Retrieval narrows the context to useful sources.",
            final: "done"
          },
          {
            id: "a6",
            label: "Tool: Re-rank",
            sub: "Sort by relevance",
            x: 430,
            y: 580,
            what: "Documents are ranked so the best evidence is first.",
            why: "Higher quality context improves the final answer.",
            final: "done"
          },
          {
            id: "a7",
            label: "Build Context",
            sub: "Prepare evidence packet",
            x: 430,
            y: 710,
            what: "Top snippets are packaged for the model.",
            why: "The model needs concise and structured grounding.",
            final: "done"
          },
          {
            id: "a8",
            label: "Compose Answer",
            sub: "Return to main agent flow",
            x: 170,
            y: 710,
            what: "The agent writes the answer using retrieved context.",
            why: "This merges reasoning with factual evidence.",
            final: "done"
          },
          {
            id: "a9",
            label: "Final Response",
            sub: "Send answer to user",
            x: 170,
            y: 840,
            what: "The final response is delivered.",
            why: "The run completes after the grounded answer is ready.",
            final: "done"
          }
        ],
        edges: [
          {from: "a1", to: "a2"},
          {from: "a2", to: "a3"},
          {from: "a3", to: "a4"},
          {from: "a4", to: "a5"},
          {from: "a5", to: "a6"},
          {from: "a6", to: "a7"},
          {from: "a7", to: "a8"},
          {from: "a8", to: "a9"}
        ]
      }
    ];

    const state = {
      runId: runs[2].id,
      playing: false,
      speed: 1,
      phase: 0,
      phaseProgress: 0,
      lastTs: 0,
      selectedNodeId: null,
      nodeStates: {},
    };

    const dom = {
      runSelect: document.getElementById("runSelect"),
      startBtn: document.getElementById("startBtn"),
      pauseBtn: document.getElementById("pauseBtn"),
      resetBtn: document.getElementById("resetBtn"),
      speedSelect: document.getElementById("speedSelect"),
      flowCanvas: document.getElementById("flowCanvas"),
      topChips: document.getElementById("topChips"),
      selectedState: document.getElementById("selectedState"),
      whatText: document.getElementById("whatText"),
      whyText: document.getElementById("whyText"),
      overallText: document.getElementById("overallText"),
      overallNote: document.getElementById("overallNote"),
      traceText: document.getElementById("traceText"),
    };

    function currentRun() {
      return runs.find((run) => run.id === state.runId) || runs[0];
    }

    function resetNodeStates() {
      const run = currentRun();
      const map = {};
      for (const node of run.nodes) map[node.id] = "idle";
      state.nodeStates = map;
      state.phase = 0;
      state.phaseProgress = 0;
      state.lastTs = 0;
      state.selectedNodeId = run.nodes[0]?.id || null;
    }

    function setupRunSelect() {
      dom.runSelect.innerHTML = runs.map((run) => `<option value="${run.id}">${run.name}</option>`).join("");
      dom.runSelect.value = state.runId;
      dom.runSelect.addEventListener("change", () => {
        state.runId = dom.runSelect.value;
        state.playing = false;
        resetNodeStates();
        render();
      });
    }

    function stateClass(status) {
      if (status === "running") return "state-running";
      if (status === "done") return "state-done";
      if (status === "warn") return "state-warn";
      if (status === "error") return "state-error";
      return "state-idle";
    }

    function clearFlow() {
      dom.flowCanvas.innerHTML = "";
    }

    function makeNode(node) {
      const element = document.createElement("article");
      element.className = `node ${stateClass(state.nodeStates[node.id])}`;
      element.style.left = `${node.x}px`;
      element.style.top = `${node.y}px`;
      element.dataset.nodeId = node.id;
      element.innerHTML = `
        <p class="node-title"><span class="dot"></span>${node.label}</p>
        <p class="node-sub">${node.sub}</p>
      `;
      element.addEventListener("click", () => {
        state.selectedNodeId = node.id;
        renderDetails();
      });
      dom.flowCanvas.appendChild(element);
      return element;
    }

    function getNodeCenter(node) {
      return {x: node.x + 105, y: node.y + 32};
    }

    function makeEdge(fromNode, toNode, active) {
      const p1 = getNodeCenter(fromNode);
      const p2 = getNodeCenter(toNode);
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const length = Math.sqrt(dx * dx + dy * dy);
      const angle = Math.atan2(dy, dx) * (180 / Math.PI);

      const edge = document.createElement("div");
      edge.className = `edge${active ? " active" : ""}`;
      edge.style.left = `${p1.x}px`;
      edge.style.top = `${p1.y}px`;
      edge.style.width = `${length}px`;
      edge.style.transform = `rotate(${angle}deg)`;
      dom.flowCanvas.appendChild(edge);
      return {edge, p1, p2, length};
    }

    function makePulseAt(pos) {
      const pulse = document.createElement("div");
      pulse.className = "pulse";
      pulse.style.left = `${pos.x - 5}px`;
      pulse.style.top = `${pos.y - 5}px`;
      dom.flowCanvas.appendChild(pulse);
      return pulse;
    }

    function renderChips() {
      const run = currentRun();
      const doneCount = Object.values(state.nodeStates).filter((s) => s === "done").length;
      const warnCount = Object.values(state.nodeStates).filter((s) => s === "warn").length;
      const errorCount = Object.values(state.nodeStates).filter((s) => s === "error").length;
      const total = run.nodes.length;

      dom.topChips.innerHTML = `
        <span class="chip">${doneCount}/${total} done</span>
        <span class="chip">${warnCount} warnings</span>
        <span class="chip">${errorCount} errors</span>
        <span class="chip">${run.totalMs} ms</span>
      `;
    }

    function renderFlow() {
      clearFlow();
      const run = currentRun();
      const byId = Object.fromEntries(run.nodes.map((node) => [node.id, node]));

      run.edges.forEach((edge, idx) => {
        const from = byId[edge.from];
        const to = byId[edge.to];
        const isPast = idx < state.phase;
        const isActive = idx === state.phase && state.playing;
        const built = makeEdge(from, to, isPast || isActive);

        if (isActive) {
          const t = state.phaseProgress;
          const x = built.p1.x + (built.p2.x - built.p1.x) * t;
          const y = built.p1.y + (built.p2.y - built.p1.y) * t;
          makePulseAt({x, y});
        }
      });

      run.nodes.forEach(makeNode);
    }

    function getSelectedNode() {
      const run = currentRun();
      return run.nodes.find((node) => node.id === state.selectedNodeId) || run.nodes[0] || null;
    }

    function describeOverall() {
      const run = currentRun();
      const done = Object.values(state.nodeStates).filter((s) => s === "done").length;
      const warn = Object.values(state.nodeStates).filter((s) => s === "warn").length;
      const err = Object.values(state.nodeStates).filter((s) => s === "error").length;

      if (!state.playing && done === 0 && warn === 0 && err === 0) {
        return {title: "Ready", note: "Press Start to watch the agent flow."};
      }
      if (state.playing) {
        return {title: "Running", note: "The blue pulse shows the live path."};
      }
      if (err > 0) {
        return {title: "Finished with recovery", note: run.result};
      }
      if (warn > 0) {
        return {title: "Finished with warning", note: run.result};
      }
      return {title: "Finished", note: run.result};
    }

    function renderDetails() {
      const run = currentRun();
      const node = getSelectedNode();
      const stateLabel = node ? (state.nodeStates[node.id] || "idle") : "idle";
      const overall = describeOverall();

      dom.selectedState.textContent = node ? `${node.label} · ${stateLabel}` : "No step selected";
      dom.whatText.textContent = node ? node.what : "-";
      dom.whyText.textContent = node ? node.why : "-";
      dom.overallText.textContent = overall.title;
      dom.overallNote.textContent = overall.note;
      dom.traceText.textContent = `trace=${run.id}`;
    }

    function applyPhaseStates() {
      const run = currentRun();
      const nodeOrder = [];
      if (!run.nodes.length) return;

      nodeOrder.push(run.nodes[0].id);
      run.edges.forEach((edge) => nodeOrder.push(edge.to));

      run.nodes.forEach((node) => {
        state.nodeStates[node.id] = "idle";
      });

      for (let i = 0; i < nodeOrder.length; i += 1) {
        const id = nodeOrder[i];
        if (i < state.phase) {
          const node = run.nodes.find((n) => n.id === id);
          if (node) state.nodeStates[id] = node.final;
        }
      }

      const currentId = nodeOrder[state.phase];
      if (currentId) state.nodeStates[currentId] = "running";

      if (!state.playing) {
        const completedEdges = Math.floor(state.phase);
        for (let i = 0; i < completedEdges; i += 1) {
          const id = nodeOrder[i];
          const node = run.nodes.find((n) => n.id === id);
          if (node && state.nodeStates[id] === "running") state.nodeStates[id] = node.final;
        }
      }

      if (state.phase >= run.edges.length) {
        run.nodes.forEach((node) => {
          state.nodeStates[node.id] = node.final;
        });
      }
    }

    function tick(ts) {
      if (!state.playing) {
        state.lastTs = ts;
        requestAnimationFrame(tick);
        return;
      }

      const run = currentRun();
      if (!state.lastTs) state.lastTs = ts;
      const dt = (ts - state.lastTs) / 1000;
      state.lastTs = ts;

      const secPerEdge = 1.05 / state.speed;
      state.phaseProgress += dt / secPerEdge;

      if (state.phaseProgress >= 1) {
        state.phaseProgress = 0;
        state.phase += 1;

        const order = [run.nodes[0]?.id, ...run.edges.map((e) => e.to)].filter(Boolean);
        if (order[state.phase]) state.selectedNodeId = order[state.phase];
      }

      if (state.phase >= run.edges.length + 1) {
        state.phase = run.edges.length;
        state.phaseProgress = 1;
        state.playing = false;
      }

      applyPhaseStates();
      renderFlow();
      renderChips();
      renderDetails();

      requestAnimationFrame(tick);
    }

    function render() {
      applyPhaseStates();
      renderChips();
      renderFlow();
      renderDetails();
    }

    dom.startBtn.addEventListener("click", () => {
      const run = currentRun();
      if (state.phase >= run.edges.length) {
        resetNodeStates();
      }
      state.playing = true;
      render();
    });

    dom.pauseBtn.addEventListener("click", () => {
      state.playing = false;
      applyPhaseStates();
      render();
    });

    dom.resetBtn.addEventListener("click", () => {
      state.playing = false;
      resetNodeStates();
      render();
    });

    dom.speedSelect.addEventListener("change", () => {
      state.speed = Number(dom.speedSelect.value) || 1;
    });

    setupRunSelect();
    resetNodeStates();
    render();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
