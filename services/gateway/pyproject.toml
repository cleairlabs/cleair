[project]
name = "cleair-gateway"
version = "0.1.0"
description = "cleair llmSHAP inference gateway"
authors = [{ name = "Filip Naudot" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "celery[redis]>=5.3.0",
  "fastapi>=0.110.0",
  "llmSHAP[full]>=1.5.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.26.0",
  "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
