name: gateway-tests

on:
  push:
    branches: [main]
    paths:
      - 'services/gateway/**'
      - '.github/workflows/gateway-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/gateway/**'
      - '.github/workflows/gateway-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e services/gateway[test]

      - name: Run tests
        run: pytest services/gateway/tests -vv
