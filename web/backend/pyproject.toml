[project]
name = "cleair-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "opentelemetry-proto>=1.20.0",
    "protobuf>=4.25.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
test = ["httpx>=0.27.0", "pytest>=7.0.0",]

[project.scripts]
serve = "cleair_backend.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cleair_backend"]
